services:
  - type: web
    name: backend-1
    runtime: node
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: UPLOADS_PUBLIC
        value: 'false'
      - key: RATE_LIMIT_TTL_MS
        value: '60000'
      - key: RATE_LIMIT_MAX
        value: '120'
      - key: CORS_ORIGINS
        value: ''
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_SIGNING_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: TOUR_API_SERVICE_KEY
        sync: false
